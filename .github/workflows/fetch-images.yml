name: Fetch site images
on:
  push:
    paths: ['.github/workflows/fetch-images.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          pip install pillow >/dev/null
          mkdir -p images src
          B="https://images.squarespace-cdn.com/content/v1/6a27ed98b68092784f7dad62"
          dl(){ curl -sSL -A "Mozilla/5.0" -H "Accept: image/png,image/jpeg,*/*" "$B/$1?format=2500w" -o "src/$2"; file "src/$2"; }
          dl a10e001a-ff66-4002-b3b5-805670e55ec0/AK_Logo_White.png logo
          dl c25fd0df-588d-4e9b-b477-5a8ed65d91f3/Lounge_edited.png hero-lounge
          dl 69d1f1a8-d0cf-4ad9-ac5d-53cf449c4174/FAC6BEBC-4B22-4AFC-BEA4-ACC6B2D8FF6D.PNG result-1
          dl ed94651d-530a-4ec2-b970-39567d4eb9fe/9433D496-9E7D-40EF-9A47-ABBF2363FF36.PNG result-2
          dl 890eb176-cef4-4ca2-8180-62166af3b8d7/Lounge_Dog_Edited.png result-lounge-dog
          dl f798129c-d920-4f08-909b-f5308304e405/C1418B69-656B-406F-9695-926E2914B150.PNG price-feature
          dl 09848d89-5faf-4b1d-b0d0-2f8a0dee21d4/IMG_6294.jpg about-1
          dl 0c58a2c0-8c2c-4a20-8cea-4f8f6660a019/IMG_6380.jpg about-2
          dl 9f0f43d0-f5e0-44e6-91fa-3d7daa465b15/Bedroom_Edited.png bedroom-1
          dl 0dd91efc-df26-4138-8810-985d96fa5b16/Bedroom_Edited.png bedroom-2
          dl 1785217039933-12ESLKJ0SFSDJAG7O4KB/unsplash-image-5TXz228u4eo.jpg services-banner
          dl 52b8ff12-ff1e-48a3-a06f-a594bb0e7f08/DO+YOU+NEED+HOME+CLEANING.png contact-graphic-1
          dl 3f6676f9-22e8-4a21-bc90-638df2ea9146/WELCOME+TO+copy.png contact-graphic-2
          dl 68f26cc3-5df4-40de-a163-ef0ecf7fcd96/WELCOME+TO+copy.png contact-graphic-3
          python3 - <<'PY'
          from PIL import Image
          import os
          for f in sorted(os.listdir('src')):
              try:
                  im = Image.open('src/'+f)
              except Exception as e:
                  print('skip', f, e); continue
              print(f, im.size, im.mode)
              if f == 'logo':
                  im.convert('RGBA').save('images/logo-white.png', optimize=True)
                  continue
              im = im.convert('RGB')
              if im.width > 1800:
                  im = im.resize((1800, round(im.height*1800/im.width)), Image.LANCZOS)
              im.save('images/'+f+'.jpg', quality=84, optimize=True, progressive=True)
          PY
          rm -rf src
          ls -la images
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images
          git commit -m "Add images fetched from akprestigecleaningau.com" || echo "nothing to commit"
          git push
